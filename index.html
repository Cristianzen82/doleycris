<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Invitación D&C</title>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Raleway:wght@300;400&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width:100%; height:100%;
  overflow:hidden;
  background:#1a0e2a;
  font-family:'Cormorant Garamond',serif;
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
}

/* ════════════════════════════════
   SCENE CONTAINER
════════════════════════════════ */
#scene {
  position:fixed; inset:0;
  display:flex; align-items:center; justify-content:center;
  perspective:800px;
}

/* ════════════════════════════════
   BACKGROUND — watercolor ballroom
════════════════════════════════ */
#bg {
  position:absolute; inset:0;
  overflow:hidden;
  opacity:0;
  animation: bgReveal 2.4s 0.2s cubic-bezier(0.4,0,0.2,1) forwards;
}
@keyframes bgReveal {
  0%   { opacity:0; transform:scale(1.06); }
  100% { opacity:1; transform:scale(1); }
}

/* Sky gradient */
#bg-sky {
  position:absolute; inset:0;
  background: radial-gradient(ellipse at 50% 20%,
    #f5e8d5 0%, #e8d0b8 25%, #c8a898 50%, #7a4a6a 75%, #3a1a4a 100%);
}

/* Vignette */
#bg::after {
  content:'';
  position:absolute; inset:0;
  background: radial-gradient(ellipse at 50% 50%,
    transparent 20%, rgba(15,8,28,0.55) 80%, rgba(15,8,28,0.85) 100%);
}

/* ════════════════════════════════
   WISTERIA — decorative corners
════════════════════════════════ */
.wisteria {
  position:absolute; bottom:0;
  pointer-events:none; z-index:2;
  opacity:0;
  animation: wisAppear 1.6s 2.4s ease forwards;
}
.wisteria.left  { left:0;  width:min(180px,38vw); transform-origin:bottom left; }
.wisteria.right { right:0; width:min(180px,38vw); transform-origin:bottom right; transform:scaleX(-1); }
@keyframes wisAppear { to { opacity:0.75; } }

/* ════════════════════════════════
   ENVELOPE WRAPPER
════════════════════════════════ */
#env-wrap {
  position:relative;
  z-index:10;
  width:min(300px,82vw);
  opacity:0;
  transform: translateY(70px) scale(0.85);
  animation: envAppear 1s 2s cubic-bezier(0.34,1.5,0.64,1) forwards;
}
@keyframes envAppear {
  to { opacity:1; transform:translateY(0) scale(1); }
}
#env-wrap.floating {
  animation: envAppear 1s 2s cubic-bezier(0.34,1.5,0.64,1) forwards,
             float 3.5s 3.2s ease-in-out infinite;
}
@keyframes float {
  0%,100% { transform:translateY(0) rotate(0deg); }
  33%      { transform:translateY(-9px) rotate(0.4deg); }
  66%      { transform:translateY(-4px) rotate(-0.3deg); }
}

/* ── LETTER (behind envelope) ── */
#letter {
  position:absolute;
  bottom:18%; left:50%;
  transform:translateX(-50%) translateY(20px);
  width:80%;
  z-index:4;
  opacity:0;
  transition: opacity 0.7s, transform 0.9s cubic-bezier(0.34,1.2,0.64,1);
  pointer-events:none;
  filter:drop-shadow(0 8px 24px rgba(0,0,0,0.4));
}
#letter.risen {
  opacity:1;
  transform:translateX(-50%) translateY(-62%);
  pointer-events:auto;
}

/* ── ENVELOPE SVG layers ── */
#env-svg {
  position:relative; width:100%;
  cursor:pointer;
  filter:drop-shadow(0 16px 48px rgba(0,0,0,0.55)) drop-shadow(0 2px 8px rgba(0,0,0,0.3));
  z-index:6;
}

/* Individual layers inside env-svg */
.env-layer {
  position:absolute; inset:0; width:100%; height:100%;
  transition:opacity 0.12s ease;
}
#layer-closed   { opacity:1; position:relative; }
#layer-cracking { opacity:0; }
#layer-opening  { opacity:0; }
#layer-open     { opacity:0; }

/* ── SEAL PULSE RING ── */
#seal-ring {
  position:absolute;
  left:50%; bottom:34%;
  transform:translateX(-50%);
  width:68px; height:68px;
  border-radius:50%;
  border:2px solid rgba(200,120,120,0.6);
  pointer-events:none;
  animation:sealPulse 2s 3.4s ease-in-out infinite;
  z-index:20;
}
@keyframes sealPulse {
  0%   { transform:translateX(-50%) scale(1);    opacity:0.7; }
  70%  { transform:translateX(-50%) scale(1.55); opacity:0; }
  100% { transform:translateX(-50%) scale(1);    opacity:0; }
}

/* ── CRACK PARTICLES ── */
#particles {
  position:absolute;
  left:50%; bottom:34%;
  transform:translateX(-50%);
  width:70px; height:70px;
  pointer-events:none;
  z-index:25;
}
.particle {
  position:absolute;
  border-radius:2px;
  opacity:0;
  top:50%; left:50%;
}

/* ── TAP HINTS ── */
#hint-seal {
  position:absolute; bottom:-38px; left:50%;
  transform:translateX(-50%);
  color:rgba(255,245,235,0.65);
  font-size:11px; letter-spacing:2.5px;
  text-transform:uppercase; white-space:nowrap;
  font-family:'Raleway',sans-serif; font-weight:300;
  animation:blinkAnim 2s 3.8s ease-in-out infinite;
}
#hint-go {
  position:absolute; bottom:-46px; left:50%;
  transform:translateX(-50%);
  color:rgba(255,245,235,0.8);
  font-size:13px; font-style:italic; white-space:nowrap;
  letter-spacing:1px;
  opacity:0; transition:opacity 0.6s;
}
#hint-go.show { opacity:1; animation:blinkAnim 1.8s ease-in-out infinite; }
@keyframes blinkAnim {
  0%,100% { opacity:0.7; } 50% { opacity:0.15; }
}

/* ════════════════════════════════
   SHIMMER on envelope
════════════════════════════════ */
#env-wrap::after {
  content:'';
  position:absolute; inset:0; z-index:15;
  background:linear-gradient(120deg,
    transparent 35%, rgba(255,255,255,0.07) 50%, transparent 65%);
  pointer-events:none;
  animation:shimmer 5s 4s ease-in-out infinite;
}
@keyframes shimmer {
  0%,100% { opacity:0; } 45%,55% { opacity:1; }
}

/* ════════════════════════════════
   SCREEN FLASH on seal break
════════════════════════════════ */
#flash {
  position:fixed; inset:0; z-index:999;
  background:rgba(255,240,230,0.85);
  opacity:0; pointer-events:none;
  transition:opacity 0.05s;
}
#flash.show { opacity:1; }
</style>
</head>
<body>

<div id="scene">
<div id="flash"></div>

<!-- ════ BACKGROUND ════ -->
<div id="bg">
  <div id="bg-sky"></div>

  <!-- Illustrated ballroom scene in SVG -->
  <svg style="position:absolute;inset:0;width:100%;height:100%" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Warm watercolor background wash -->
      <radialGradient id="skyGrad" cx="50%" cy="25%" r="70%">
        <stop offset="0%"   stop-color="#f8e8d0" stop-opacity="1"/>
        <stop offset="40%"  stop-color="#e0c4a8" stop-opacity="1"/>
        <stop offset="75%"  stop-color="#c09080" stop-opacity="1"/>
        <stop offset="100%" stop-color="#5a2a4a" stop-opacity="1"/>
      </radialGradient>
      <radialGradient id="floorGrad" cx="50%" cy="100%" r="60%">
        <stop offset="0%"  stop-color="#d4b090" stop-opacity="0.8"/>
        <stop offset="100%" stop-color="#7a3a5a" stop-opacity="0"/>
      </radialGradient>
      <!-- Soft watercolor blobs -->
      <filter id="watercolor" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="4" seed="2" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="glow">
        <feGaussianBlur stdDeviation="6" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="softBlur">
        <feGaussianBlur stdDeviation="2.5"/>
      </filter>
    </defs>

    <!-- Sky wash -->
    <rect width="800" height="600" fill="url(#skyGrad)"/>

    <!-- Watercolor texture blobs (background atmosphere) -->

    <ellipse cx="600" cy="180" rx="160" ry="110" fill="#e8c8b0" opacity="0.15" filter="url(#watercolor)"/>
    <ellipse cx="400" cy="100" rx="200" ry="80"  fill="#f8e8d8" opacity="0.22" filter="url(#watercolor)"/>

    <!-- HALL ARCHITECTURE — arched columns -->
    <!-- Left arch -->

    <path d="M0,600 L0,220 Q70,100 140,220 L140,600Z" fill="#b89070" opacity="0.2"/>
    <!-- Right arch -->

    <path d="M800,600 L800,220 Q730,100 660,220 L660,600Z" fill="#b89070" opacity="0.2"/>
    <!-- Back center arch -->

    <!-- CHANDELIER -->
    <g transform="translate(400,0)" filter="url(#glow)" opacity="0.9">
      <!-- Chain -->
      <line x1="0" y1="0" x2="0" y2="55" stroke="#c8a840" stroke-width="2.5"/>
      <!-- Body -->

      <line x1="0" y1="76" x2="-45" y2="108" stroke="#c8a840" stroke-width="1.5" opacity="0.7"/>
      <line x1="0" y1="76" x2="45"  y2="108" stroke="#c8a840" stroke-width="1.5" opacity="0.7"/>

      <line x1="0" y1="76" x2="22"  y2="112" stroke="#c8a840" stroke-width="1.5" opacity="0.7"/>

      <circle cx="70"  cy="107" r="7" fill="#fff8c0" opacity="0.95"/>

      <!-- Crystal drops -->

      <ellipse cx="-45" cy="120" rx="2" ry="5"   fill="#d0eaf8" opacity="0.7"/>

    </g>

    <!-- FLOOR -->

    <!-- Floor reflection line -->

    <!-- SILHOUETTES — elegant guests with masquerade masks -->
    <!-- Far left figure -->
    <g opacity="0.45" filter="url(#watercolor)">
      <ellipse cx="95" cy="470" rx="28" ry="80" fill="#2a1030"/>

    <!-- Center couple — slightly larger, more prominent -->
    <!-- Woman -->

      <!-- Dress -->
      <path d="M330,600 Q320,520 318,470 Q328,440 348,430 Q355,450 350,480 Q348,530 345,600Z"

      <!-- White mask -->
      <path d="M336,393 Q348,385 360,393 Q357,402 348,403 Q339,402 336,393Z" fill="#f5f0e8" opacity="0.75"/>
    </g>

    <!-- Man -->
    <g opacity="0.7">
      <ellipse cx="390" cy="468" rx="22" ry="78" fill="#0e0618" opacity="0.95"/>
      <circle  cx="390" cy="382" r="21" fill="#0e0618" opacity="0.95"/>
      <!-- Dark mask -->

      <rect x="386" y="402" width="8" height="22" rx="3" fill="#9b6090" opacity="0.35"/>
    </g>

    <!-- Right background figure -->
    <g opacity="0.38" filter="url(#watercolor)">
      <ellipse cx="680" cy="468" rx="25" ry="76" fill="#1a0828"/>
      <circle  cx="680" cy="376" r="19" fill="#1a0828"/>
      <path d="M669,373 Q680,366 691,373 Q689,381 680,382 Q671,381 669,373Z" fill="#f0e0d8" opacity="0.55"/>
      <!-- Feathers right side -->
      <path d="M669,370 Q650,350 643,357 Q653,364 669,372Z" fill="#9b6090" opacity="0.45"/>
    </g>

    <!-- Far right figure -->
    <g opacity="0.3">
      <ellipse cx="750" cy="478" rx="20" ry="70" fill="#1a0828"/>
      <circle  cx="750" cy="392" r="17" fill="#1a0828"/>
    </g>

    <!-- ATMOSPHERE — soft light beams from chandelier -->
    <line x1="400" y1="130" x2="150" y2="540" stroke="#f8e8c0" stroke-width="40" opacity="0.04"/>
    <line x1="400" y1="130" x2="650" y2="540" stroke="#f8e8c0" stroke-width="40" opacity="0.04"/>
    <line x1="400" y1="130" x2="400" y2="600" stroke="#f8e8c0" stroke-width="50" opacity="0.05"/>

    <!-- Particle dust motes -->
    <circle cx="250" cy="200" r="2" fill="#f8e8c0" opacity="0.4"/>
    <circle cx="550" cy="240" r="1.5" fill="#f8e8c0" opacity="0.3"/>
    <circle cx="180" cy="320" r="1.5" fill="#f8e8c0" opacity="0.35"/>
    <circle cx="620" cy="280" r="2" fill="#f8e8c0" opacity="0.3"/>
    <circle cx="350" cy="180" r="1" fill="#fff8e0" opacity="0.5"/>
    <circle cx="460" cy="170" r="1" fill="#fff8e0" opacity="0.45"/>
  </svg>
</div>

<!-- ════ ENVELOPE WRAP ════ -->
<div id="env-wrap" class="floating">

  <!-- LETTER (rises from inside) -->
  <div id="letter">
    <svg viewBox="0 0 220 200" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;filter:drop-shadow(0 6px 20px rgba(0,0,0,0.4))">
      <defs>
        <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#fdf8f0"/>
          <stop offset="100%" stop-color="#f0e4d0"/>
        </linearGradient>
        <!-- Paper texture -->

<script>
// ══════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════
const DESTINATION = 'https://www.google.com'; // ← cambia por tu URL de invitación

// ══════════════════════════════════════
//  STATE MACHINE
//  0 = closed  1 = cracking  2 = opening
//  3 = open    4 = letter shown  5 = ready to navigate
// ══════════════════════════════════════
let state = 0;

const envWrap   = document.getElementById('env-wrap');
const letter    = document.getElementById('letter');
const hintSeal  = document.getElementById('hint-seal');
const hintGo    = document.getElementById('hint-go');
const sealRing  = document.getElementById('seal-ring');
const particles = document.getElementById('particles');
const flash     = document.getElementById('flash');

// Layer elements
const lClosed   = document.getElementById('layer-closed');
const lCracking = document.getElementById('layer-cracking');
const lOpening  = document.getElementById('layer-opening');
const lOpen     = document.getElementById('layer-open');

// SVG sub-elements for letter animation
const letterOrnament = document.getElementById('letter-ornament');
const letterName     = document.getElementById('letter-name-svg');
const letterDivider  = document.getElementById('letter-divider');
const letterSub1     = document.getElementById('letter-sub1');
const letterSub2     = document.getElementById('letter-sub2');
const letterFlourish = document.getElementById('letter-flourish');

// ── Show envelope layer ──
function showLayer(n) {
  const layers = [lClosed, lCracking, lOpening, lOpen];
  layers.forEach((l, i) => {
    l.style.opacity = i === n ? '1' : '0';
    l.style.transition = 'opacity 0.18s ease';
  });
}

// ── SVG attr animation helper ──
function fadeSVGEl(el, toOpacity, delay=0, duration=600) {
  if (!el) return;
  el.style.transition = `opacity ${duration}ms ${delay}ms ease, transform ${duration}ms ${delay}ms ease`;
  el.style.transform = 'translateY(0)';
  el.style.opacity = toOpacity;
}

// ── Screen flash ──
function doFlash() {
  flash.style.opacity = '1';
  setTimeout(() => { flash.style.transition='opacity 0.35s'; flash.style.opacity='0'; }, 60);
  setTimeout(() => { flash.style.transition=''; }, 500);
}

// ── Wax particles burst ──
function burstParticles() {
  particles.innerHTML = '';
  const colors = ['#aa2828','#881818','#cc4444','#d4607a','#e0a0b0','#c0d0f0','#f8e8d0'];
  const shapes = ['circle','square','triangle'];

  for (let i = 0; i < 22; i++) {
    const p = document.createElement('div');
    const size  = 5 + Math.random() * 11;
    const angle = (i / 22) * 360 + (Math.random() - 0.5) * 28;
    const dist  = 32 + Math.random() * 38;
    const dx    = Math.cos(angle * Math.PI / 180) * dist;
    const dy    = Math.sin(angle * Math.PI / 180) * dist;
    const color = colors[Math.floor(Math.random() * colors.length)];
    const isRound = Math.random() > 0.45;

    p.style.cssText = `
      position:absolute;
      width:${size}px; height:${size}px;
      background:${color};
      border-radius:${isRound ? '50%' : '2px'};
      top:50%; left:50%;
      transform:translate(-50%,-50%);
      opacity:1;
      transition:
        transform 0.55s cubic-bezier(0.1, 0, 0.8, 1),
        opacity 0.45s 0.15s ease;
      will-change:transform,opacity;
    `;
    particles.appendChild(p);

    requestAnimationFrame(() => requestAnimationFrame(() => {
      p.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))
                           rotate(${Math.random()*360}deg) scale(${0.1 + Math.random()*0.3})`;
      p.style.opacity = '0';
    }));
  }
}

// ── Shake envelope ──
function shake() {
  const offsets = [5,-5,4,-4,2,-2,1,0];
  offsets.forEach((v, i) => {
    setTimeout(() => {
      envWrap.style.transform = `translateY(0) translateX(${v}px)`;
      if (i === offsets.length - 1) envWrap.style.transform = '';
    }, i * 55);
  });
}

// ── Main open sequence ──
function startOpen() {
  if (state !== 0) return;
  state = 1;

  // Stop floating
  envWrap.style.animation = 'none';
  envWrap.style.transform = 'translateY(0)';

  // Fade hint
  hintSeal.style.transition = 'opacity 0.3s';
  hintSeal.style.opacity = '0';
  sealRing.style.display = 'none';

  // Flash + particles
  doFlash();
  burstParticles();

  // Step 1 → cracking (immediate)
  setTimeout(() => {
    showLayer(1); // cracking
    shake();
    state = 2;
  }, 60);

  // Step 2 → opening (flap lifts)
  setTimeout(() => {
    showLayer(2); // opening
  }, 620);

  // Step 3 → fully open
  setTimeout(() => {
    showLayer(3); // open
    state = 3;
  }, 1180);

  // Step 4 → letter rises
  setTimeout(() => {
    letter.classList.add('risen');
  }, 1500);

  // Step 5 → animate letter contents sequentially
  // Ornament
  setTimeout(() => {
    letterOrnament.style.transition = 'opacity 0.5s';
    letterOrnament.style.opacity    = '1';
  }, 2000);

  // Name
  setTimeout(() => {
    letterName.style.transition  = 'opacity 0.8s ease, transform 0.8s ease';
    letterName.style.transform   = 'translateY(0)';
    letterName.style.opacity     = '1';
  }, 2300);

  // Divider
  setTimeout(() => {
    letterDivider.style.transition = 'opacity 0.5s';
    letterDivider.style.opacity    = '1';
  }, 2900);

  // Sub lines
  setTimeout(() => {
    letterSub1.style.transition = 'opacity 0.6s ease';
    letterSub1.style.opacity    = '1';
  }, 3200);
  setTimeout(() => {
    letterSub2.style.transition = 'opacity 0.6s ease';
    letterSub2.style.opacity    = '1';
  }, 3600);

  // Flourish
  setTimeout(() => {
    letterFlourish.style.transition = 'opacity 0.5s';
    letterFlourish.style.opacity    = '1';
  }, 4000);

  // Show proceed hint
  setTimeout(() => {
    hintGo.classList.add('show');
    state = 5;
  }, 4400);
}

// ══════════════════════════════════════
//  CLICK / TAP HANDLER
// ══════════════════════════════════════
envWrap.addEventListener('click', function(e) {
  if (state === 0) {
    // Detect tap near seal region (center-x, ~60-75% down the envelope)
    const rect = envWrap.getBoundingClientRect();
    const relX = (e.clientX - rect.left) / rect.width;
    const relY = (e.clientY - rect.top)  / rect.height;

    if (relX > 0.28 && relX < 0.72 && relY > 0.52 && relY < 0.76) {
      startOpen();
    } else {
      // Pulse to draw attention to seal
      sealRing.style.animation = 'none';
      void sealRing.offsetWidth; // reflow
      sealRing.style.animation = 'sealPulse 0.5s ease-out';
      envWrap.style.transform = 'translateY(-6px) scale(1.02)';
      setTimeout(() => envWrap.style.transform = '', 250);
    }
  } else if (state === 5) {
    window.location.href = DESTINATION;
  }
});

// Touch support
envWrap.addEventListener('touchend', function(e) {
  e.preventDefault();
}, { passive: false });

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    if (state === 0) startOpen();
    else if (state === 5) window.location.href = DESTINATION;
  }
});
</script>
</body>
</html>
