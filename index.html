<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dolennis & Cristian — Matrimonio</title>
  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --blush: #d4a5a5;
      --blush-light: #e8c9c9;
      --blush-pale: #f5e8e8;
      --dusty-blue: #8fa8bc;
      --dusty-blue-light: #b8ccd8;
      --dusty-blue-pale: #e8eff5;
      --sage: #8aab8a;
      --sage-light: #b0c9b0;
      --sage-pale: #e8f0e8;
      --warm-white: #fdfaf7;
      --off-white: #f8f3ee;
      --charcoal: #3a3535;
      --mid-grey: #7a7070;
      --text-light: #a09090;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Raleway', sans-serif;
      background: var(--warm-white);
      color: var(--charcoal);
      overflow-x: hidden;
    }

    .hero { min-height: 100vh; position: relative; overflow: hidden; background: var(--warm-white); }
    .hero-photo-frame {
      aspect-ratio: 4 / 3;
      border-radius: 4px;
      overflow: hidden;
      border: 10px solid white;
      box-shadow: 0 8px 40px rgba(0,0,0,0.10);
      background: linear-gradient(135deg, var(--blush-light), var(--dusty-blue-light));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gate-overlay {
      position: fixed;
      inset: 0;
      z-index: 9998;
      background: linear-gradient(160deg, var(--blush-pale) 0%, var(--dusty-blue-pale) 50%, var(--sage-pale) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: opacity 0.6s ease;
    }

    .gate-overlay.hide {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="gate-overlay" class="gate-overlay">
    <div class="gate-card">
      <input id="gate-input" type="text" placeholder="ej: maria@correo.com o 56912345678">
      <button id="gate-btn" type="button">Ingresar a la invitación</button>
      <div id="gate-error" class="gate-error"></div>
    </div>
  </div>

  <script>
    const GUESTS = [
      { id: 'maria@correo.com', name: 'María González', avatar: '🌸', points: 0 },
      { id: '56912345678', name: 'Pedro Soto', avatar: '🎻', points: 50 }
    ];

    function normalizeInput(val) {
      return val.trim().toLowerCase().replace(/\s+/g, '');
    }

    function getTierInfo(points) {
      if (points >= 100) return { label: 'Legendario', color: '#d4a5a5' };
      if (points >= 50) return { label: 'Espléndido', color: '#c9943a' };
      if (points >= 20) return { label: 'Generoso', color: '#8fa8bc' };
      if (points >= 5) return { label: 'Simpático', color: '#8aab8a' };
      return { label: 'Sin nivel aún', color: '#a09090' };
    }

    function showBanner(guest) {
      const banner = document.getElementById('guest-banner');
      if (!banner) return;
      banner.style.display = 'flex';
    }

    function checkAccess() {
      const raw = document.getElementById('gate-input').value;
      const input = normalizeInput(raw);
      const errEl = document.getElementById('gate-error');

      if (!input) {
        errEl.textContent = 'Por favor ingresa tu correo o número de teléfono.';
        errEl.classList.add('show');
        return;
      }

      const guest = GUESTS.find(g => normalizeInput(g.id) === input);

      if (!guest) {
        errEl.innerHTML = 'No encontramos tus datos en la lista de invitados.<br>Verifica e intenta nuevamente.';
        errEl.classList.add('show');
        return;
      }

      errEl.classList.remove('show');
      document.getElementById('gate-overlay').classList.add('hide');
      showBanner(guest);
      sessionStorage.setItem('wedding_guest', JSON.stringify(guest));
    }

    document.getElementById('gate-btn').addEventListener('click', checkAccess);
    document.getElementById('gate-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') checkAccess();
    });
  </script>
</body>
</html>
